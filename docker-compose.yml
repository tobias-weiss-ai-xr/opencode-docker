# OpenCode Docker Compose Configuration
# Uses custom Alpine-based image: opencode-ai:latest

x-opencode-common: &opencode-common
  image: opencode-ai:latest
  working_dir: /workspace
  environment:
    PATH: "/home/op/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  volumes:
    - ${HOME}/.config/opencode:/home/op/.config/opencode
    - ${HOME}/.local/share/opencode:/home/op/.local/share/opencode
    - ${HOME}/.local/state:/home/op/.local/state
    - .:/workspace

services:
  opencode:
    <<: *opencode-common
    container_name: opencode-dev
    stdin_open: true
    tty: true
    command: ["opencode"]